name: Desktop bundles
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Linux media and Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libpulse0 libxcb-cursor0 libxkbcommon-x11-0
      - name: macOS media tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/build.py
      - run: python scripts/make_demo.py
      - run: python scripts/check_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: FramePick-${{ matrix.os }}
          path: |
            dist/FramePick-*.exe
            dist/FramePick-*-linux-*
            dist/FramePick-*-darwin-*
            dist/*.zip
            dist/*.sha256
            dist/*.build-info.json
