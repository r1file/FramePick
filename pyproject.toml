[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "framepick"
version = "0.3.0"
description = "Pick moments from long videos with a sliding window; export independent GIFs and screenshots."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6-Essentials==6.12.0", "PySide6-Addons==6.12.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "Pillow==12.3.0", "pyinstaller==6.22.3"]

[project.scripts]
framepick = "framepick.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
framepick = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: exercises real FFmpeg binaries", "gui: exercises Qt widgets and playback"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
